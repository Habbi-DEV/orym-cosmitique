<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1a1a1a" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>ORYAM Cosmetics — Soins & Beauté en Algérie</title>
    <meta
      name="description"
      content="ORYAM Cosmetics — sérums, crèmes, huiles et soins naturels. Livraison vers les 58 wilayas en 24-72h, paiement à la réception."
    />

    <!-- Open Graph / réseaux sociaux — valeurs par défaut (page d'accueil).
         Les pages produit surchargent ces balises dynamiquement via src/lib/seo.ts,
         mais un scraper qui ne lit que le HTML brut (premier partage WhatsApp/FB)
         verra toujours ces valeurs par défaut correctes. -->
    <meta property="og:site_name" content="ORYAM Cosmetics" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ORYAM Cosmetics — Soins & Beauté en Algérie" />
    <meta
      property="og:description"
      content="Sérums, crèmes, huiles et soins naturels. Livraison vers les 58 wilayas en 24-72h, paiement à la réception."
    />
    <meta property="og:image" content="/img/hero.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
